# ---------------------------------------------------------------- 经济

[rules.in_default]
title = "你已经违约"
advice = "国家无力偿还债务。尽快让每周收支转为正数。"
why = "违约的国家会受到严重惩罚，并且无法再借款。每多一周赤字，情况就更糟。提高税收、削减开支是唯一的出路。"
steps = [
  "点击左侧栏的「预算」按钮（带金色徽章的那个）。",
  "把税收等级提高一级，并对富人购买的商品（如葡萄酒、奢侈服装）征收消费税。",
  "把政府工资和军队工资各降低一级。暂停眼下不需要的建造项目。",
  "观察预算面板顶部的每周收支，它必须变成绿色。",
]

[rules.budget_deficit]
title = "你正在亏钱"
advice = "每周收支为负。在金库耗尽前提高税收或削减开支。"
why = "金库耗尽后你就开始借债。债务要付利息，一旦达到信贷上限就会违约。保持少量的每周盈余能让经济安全，也能让你持续建设。"
steps = [
  "点击左侧栏的「预算」按钮（带金色徽章的那个）。",
  "查看每周收支。把鼠标悬停在收入和支出上，看看钱花在哪里。",
  "如果民众承受得起，把税收等级提高一级，或对一种热门商品征收消费税。",
  "建造也要花钱：如果赤字很大，就降低建造支出或暂停部分项目。",
  "下周再看收支。目标是小幅的绿色盈余。",
]

[rules.high_debt]
title = "债务正变得危险"
advice = "你已用掉一半以上的信贷额度。用盈余把债务还掉。"
why = "债务利息每周都在吞噬你的收入。债务达到信贷上限就会违约，这对刚起步的经济是灾难。尽早还清债务能腾出钱来搞建设。"
steps = [
  "点击左侧栏的「预算」按钮。",
  "把鼠标悬停在债务上，查看信贷上限和利息。",
  "让每周收支转正：提高税收、征收消费税或放慢建造。",
  "保持盈余直到债务还清，然后再把钱投到建造上。",
]

[rules.goods_shortage]
title = "市场商品短缺"
advice = "你的建筑所需的某些商品出现短缺。多生产这些商品，或者进口。"
why = "商品短缺时，所有使用它的建筑都会减产，运营成本也更高。工具、木材、铁或煤的短缺还会让建造又慢又贵。"
steps = [
  "点击左侧栏的「市场」按钮（带金色徽章的那个）。",
  "找到标红的商品，它们就是短缺的商品。",
  "多建造生产该商品的建筑，例如工具作坊生产工具、伐木场生产木材。",
  "如果无法自己生产，就进口：打开贸易路线页，为该商品建立进口路线。",
  "几个月后再看市场，红色标记应该消失了。",
]

[rules.no_research]
title = "选择要研究的科技"
advice = "你当前没有研究任何科技。选一项吧。"
why = "创新点每周都在产生，没有选定科技时大部分都被浪费了。新科技会解锁更好的建筑、生产方式和法律。"
steps = [
  "点击左侧栏的「科技」按钮（带金色徽章的那个）。",
  "在生产科技树中选择一项。早期的好选择是通往铁路、更好工具和证券交易所的科技。",
  "多排几项，让研究永不停歇。",
]

[rules.idle_construction]
title = "建造力正在闲置"
advice = "排入更多建筑。没用掉的建造点每周都会白白损失。"
why = "建造是国家成长的方式。建造部门每周都产出建造点，队列为空时这些点数就浪费了。长长的队列能让它们一直忙碌。"
steps = [
  "点击左侧栏的「建筑」按钮（带金色徽章的那个）。",
  "打开建造页，选择要建的建筑。",
  "早期的好选择：生产短缺商品的建筑、更多建造部门，以及在官僚不足时建政府管理机构。",
  "选择失业者或农民多、基础设施好的地区。",
  "一次排入多个建筑，让队列永不为空。",
]

[rules.hoarding_gold]
title = "金库已满"
advice = "黄金储备已达上限。把盈余花在建造上。"
why = "超过储备上限的黄金对你毫无用处。把它花在更多建造上能壮大经济，这比收你用不着的税要好。"
steps = [
  "点击左侧栏的「预算」按钮。",
  "提高建造支出，或建造更多建造部门以加快建设。",
  "如果钱还是太多，就把税收等级降低一级，民众会更高兴。",
]

[rules.grow_construction]
title = "建造更多建造部门"
advice = "你的建造能力跟不上了。建造建造部门来加快建设。"
why = "建造部门产出建造点，其他一切都靠它来建。如果队列需要一年以上才能完成，或者私人投资花不出去，更多的建造部门会让整个经济成长得更快。"
steps = [
  "点击左侧栏的「建筑」按钮（带金色徽章的那个）。",
  "选择建造部门，在一两个基础设施好的地区排入建造。",
  "确保负担得起：建造部门每周都要花钱。在预算中查看每周收支。",
  "保持木材、铁和工具便宜，因为建造会消耗它们。",
]

[rules.infrastructure]
title = "解决基础设施不足"
advice = "有地区使用的基础设施超过了它拥有的。修建铁路或颁布道路法令。"
why = "地区缺少基础设施时，市场准入会下降，那里的建筑卖出的商品更少，商品也更贵。铁路和法令可以提高基础设施。"
steps = [
  "把地图切换到基础设施地图模式（底部的地图模式按钮），找到显示为红色的地区。",
  "点击该地区。如果权威足够，在地区面板中颁布道路维护法令。",
  "研究出铁路后，在建筑界面为该地区修建铁路。",
  "在不足解决之前，不要在该地区再建工厂。",
]

# ---------------------------------------------------------------- 政府

[rules.bureaucracy_deficit]
title = "官僚不足"
advice = "官僚为负。建造政府管理机构。"
why = "官僚为负会让税收白白浪费，还会阻碍机构建设。政府管理机构产出官僚，某些法律也能减少官僚消耗。"
steps = [
  "点击左侧栏的「建筑」按钮（带金色徽章的那个）。",
  "选择政府管理机构，建在人口多的地区，比如首都。",
  "每一级都要花钱，所以请检查预算。只要官僚为负，这笔钱就值得花。",
  "留意顶栏的官僚数值，转正后就停止建造。",
]

[rules.authority_deficit]
title = "权威不足"
advice = "权威为负。取消一项法令，或通过能增加权威的法律。"
why = "权威用来支付法令和其他政府行动。权威为负时，所有消耗权威的东西都会变差。法令占用了大部分权威。"
steps = [
  "把鼠标悬停在顶栏的权威上，查看它被用在哪里。",
  "取消一项不再需要的法令：点击该地区并移除法令。",
  "之后，加强中央政府之类的法律能带来更多权威。在政治界面中寻找它们。",
]

[rules.influence_deficit]
title = "影响力不足"
advice = "影响力为负。结束一项外交条约或一个宿敌关系。"
why = "每项条约、宿敌关系和义务都要消耗影响力。用量超过拥有量时，你的外交会受损。放弃不需要的那些。"
steps = [
  "点击左侧栏的「外交」按钮（带金色徽章的那个）。",
  "把鼠标悬停在顶栏的影响力上，查看它被用在哪里。",
  "结束不需要的条约或宿敌关系：点击对应国家并取消。",
]

[rules.low_legitimacy]
title = "政府缺乏合法性"
advice = "合法性非常低。让一个受欢迎的利益集团加入政府。"
why = "合法性低时，法律更难通过，政府也不稳定。合法性来自政府中有强大且受欢迎的利益集团。"
steps = [
  "点击左侧栏的「政治」按钮（带金色徽章的那个）。",
  "查看各利益集团。圆圈越大，影响力越大。",
  "使用改组政府，加入一个尚未执政的强大利益集团。",
  "查看政治界面顶部的合法性，50 以上就比较稳妥。",
]

[rules.enact_law]
title = "推行新法律"
advice = "你目前没有在改革任何法律。开始推行一项政府支持的法律。"
why = "法律决定了一切：税收、贸易、权利和经济。在执政的利益集团支持时一次推行一项，就能稳步让国家现代化。"
steps = [
  "点击左侧栏的「政治」按钮（带金色徽章的那个），然后打开法律页。",
  "把鼠标悬停在法律上，查看哪些利益集团支持或反对，以及通过的可能性。",
  "早期的好目标：废除传统主义、农奴制或孤立主义的法律，以及允许更多工业的法律。",
  "选择执政利益集团支持的法律，点击推行。",
  "推行期间，保持合法性，不要得罪支持者。",
]

[rules.high_turmoil]
title = "民众很愤怒"
advice = "许多民众已经激进化。提高他们的生活水平。"
why = "激进分子来自下降的生活水平和他们痛恨的法律。激进分子太多会引发动乱和革命。更便宜的商品和更高的工资能让他们回心转意。"
steps = [
  "点击左侧栏的「政治」按钮，把鼠标悬停在利益集团上，查看激进分子来自哪里。",
  "解决粮食、衣服、家具等日常商品的短缺。高物价伤害所有人。",
  "如果税收或消费税很高，就降低它们。",
  "避免推行愤怒的利益集团强烈反对的法律。",
]

# ---------------------------------------------------------------- 社会

[rules.low_literacy]
title = "教育你的人民"
advice = "识字率很低。投资学校。"
why = "识字的人能从事文员、工程师等技术工作，识字率还能加快科研。学校要几十年才见效，所以要尽早开始。"
steps = [
  "点击左侧栏的「政治」按钮，打开机构页。",
  "如果你有学校相关法律，提高学校机构的等级。这需要消耗官僚。",
  "如果没有学校法律，在法律页中寻找宗教学校或公立学校。",
  "做这些时确保官僚保持为正。",
]

[rules.unemployment]
title = "让失业者有工作"
advice = "有地区失业人口很多。在那里建设工业。"
why = "失业者不生产任何东西，几乎没有收入，于是变得贫困而愤怒。在该地区新建建筑能给他们工作，也能壮大经济。"
steps = [
  "把地图切换到人口或就业地图模式，找到失业率高的地区。",
  "点击左侧栏的「建筑」按钮。",
  "在该地区建造市场需要的建筑，例如生产短缺商品的建筑。",
  "建造完成后再看看该地区。",
]

[rules.found_company]
title = "成立公司"
advice = "你可以成立一家新公司。选择与你最强产业相匹配的公司。"
why = "公司会为其拥有的建筑提供加成，并在你的国家投资。与已有产业相匹配的公司能立刻见效。"
steps = [
  "打开公司界面（指引中的「打开界面」按钮可以直接带你过去）。",
  "查看可成立的公司及其加成。",
  "选择与你已拥有大量建筑相匹配的公司，然后成立它。",
]

# ---------------------------------------------------------------- 军事与外交

[rules.diplomatic_play_target]
title = "你正受到威胁"
advice = "另一个国家对你发起了外交博弈。寻找盟友，或准备让步。"
why = "外交博弈可能演变成战争。你可以争取其他国家的支持，接受对方的要求，或者准备军队。打输一场战争的代价通常比让步更大。"
steps = [
  "点击左侧栏的「外交」按钮（带金色徽章的那个），打开这场外交博弈。",
  "比较双方实力。把鼠标悬停在博弈上，查看谁支持谁。",
  "如果有胜算，就通过提供好处来争取其他国家支持。",
  "如果你弱得多，就让步。你会失去对方要求的东西，但能保住军队和经济。",
]

[rules.at_war]
title = "打好这场战争"
advice = "你正处于战争中。动员军队并派往前线。"
why = "军队必须先动员才能作战，而且需要将领在前线指挥。动员后的军队会消耗弹药和轻武器，所以要保证这些商品的供应。"
steps = [
  "点击左侧栏的「军事」按钮（带金色徽章的那个）。",
  "动员你的军队。动员需要一些时间。",
  "给每支军队的将领下达命令（如推进或防守），把军队派往前线。",
  "留意市场上的轻武器和弹药。短缺会大大削弱军队。",
]
