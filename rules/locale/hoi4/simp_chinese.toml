# 简体中文 — HOI4 新手顾问。未翻译的条目会自动回退到英文。
# 占位符：{days} = 暂缓天数，{label} = 按钮名称，{title} = 建议标题，{n}/{total} = 步骤序号/总数。
# steps 的条数必须与 rules/hoi4.toml 中英文版本一致。

[ui]
toggle_tt = "§Y顾问§!\n打开顾问面板。金色徽章表示顾问在该处有建议。"
close_tt = "关闭"
panel_title = "新手顾问"
panel_subtitle = "§g点击任意建议，查看分步指引。§!"
debug_label = "显示全部图标"
debug_tt = "同时显示所有顾问徽章，方便检查它们是否对准顶栏按钮。再点一次恢复正常。"
footer_hint = "§g右键点击徽章可暂缓该建议 {days} 天。§!"
desc_where = "§g（{label}）§!"
badge_hint = "§g位于「{label}」界面。\n左键：教我怎么做 · 右键：暂缓 {days} 天§!"
row_hint = "§g左键：分步指引 · 右键徽章：暂缓 {days} 天§!"
snoozed_tt = "§Y{title}§! §g（已暂缓）§!\n左键点击重新启用此建议。"
card_tt = "§g点击查看分步指引§!"
guide_subtitle = "§g分步指引§!"
guide_step = "第 {n} 步，共 {total} 步"
guide_why = "为什么？"
guide_back = "上一步"
guide_next = "下一步"
guide_done = "完成"
guide_all = "全部建议"
none_label = "地图"

[categories]
economy = "经济"
military = "军事"
politics = "政治与外交"
dlc = "DLC 功能"

[targets]
politics = "政治"
intelligence = "情报"
research = "科研"
diplomacy = "外交"
trade = "贸易"
construction = "建造"
production = "生产"
deploy = "招募与部署"
logistics = "后勤"
officer_corps = "军官团"

# ---------------------------------------------------------------- 经济

[rules.plan_research]
title = "规划你的科研"
advice = "填满每个科研槽。先研究工业、电子和步兵武器。"
why = "科研不会暂停，空着的科研槽就是永远损失的时间。工业科技提高工厂产出和建造速度，惠及一切；计算机（电子）能加快之后所有的研究。"
steps = [
  "点击顶栏的「科研」按钮（带金色徽章的那个）。",
  "点击每个空的科研槽并选择一项科技。不要让任何槽位空着。",
  "推荐的首选：建造和生产科技（工业页）、计算机（电子页）以及步兵武器。",
  "避开年份远超当前日期的科技（显示红色惩罚）。有国策或决议加成的科技研究得快得多。",
]

[rules.build_civilian_factories]
title = "建造民用工厂"
advice = "和平时期，把所有建造队列都用来建造民用工厂。"
why = "民用工厂负责建造一切，包括更多的工厂。越早建造，之后的发展就越快。大多数玩家会一直建造民用工厂，直到1937–38年左右。"
steps = [
  "点击顶栏的「建造」按钮（带金色徽章的那个）。",
  "在建筑列表中选择「民用工厂」。",
  "点击地图上的省份来排队建造。优先选择有空余建筑槽、基础设施好的省份，提示框会显示建造时间。",
  "保持队列足够长。每个项目能分到的工厂有限，队列太短会让工厂闲置。",
  "把最重要的项目拖到队列最上方，排在前面的会先建。",
]

[rules.build_military_factories]
title = "转向建造军用工厂"
advice = "战争临近，把新的建造项目转为军用工厂。"
why = "军用工厂生产军队所消耗的枪炮、坦克和飞机。新工厂需要几个月才能达到满产，所以要在开战前开始建造，而不是开战后。"
steps = [
  "点击顶栏的「建造」按钮。",
  "选择「军用工厂」而不是民用工厂。",
  "在有空余建筑槽的省份排队建造，并把它们移到队列顶部。",
  "工厂建成后，打开「生产」界面把它分配到生产线上。没有分配的军用工厂什么也不生产。",
]

[rules.infantry_equipment_shortage]
title = "步兵装备即将耗尽"
advice = "给步兵装备生产线分配更多军用工厂。"
why = "每个步兵师都需要枪械。装备耗尽后，新的师无法训练，前线部队也得不到补充。这是新手最常见的装备短缺。"
steps = [
  "点击顶栏的「生产」按钮。",
  "找到步兵装备生产线。如果没有，点击「添加生产线」并选择步兵装备。",
  "点击该生产线上的 + 增加军用工厂，必要时从不那么紧急的生产线上调过来。",
  "接下来几周检查库存是否在增长。「后勤」界面会显示装备的盈余和缺口。",
]

[rules.trade_resources]
title = "进口所需资源"
advice = "缺钢、铝或橡胶的生产线效率很低。把缺的资源买进来。"
why = "每件装备都需要资源，缺少资源的生产线会损失大量产出。进口要消耗民用工厂，所以只买生产线真正需要的。"
steps = [
  "点击「生产」按钮，查看生产线上是否有红色资源图标，那表示该生产线缺少资源。",
  "点击「贸易」按钮，在左侧选择缺少的资源（钢、铝、橡胶、钨、铬或石油）。",
  "选择一个出售该资源的国家并点击进口。关系友好、盈余多的国家最好。",
  "留意民用工厂：每笔进口都会占用一些，进口太多会拖慢建造。",
]

[rules.low_fuel]
title = "燃料不足"
advice = "进口石油，或建造合成炼油厂／燃料库。"
why = "没有燃料，坦克、飞机和舰船都会战斗力大减。进口或生产的石油会转化为燃料。"
steps = [
  "点击「贸易」按钮并选择石油。",
  "从出售石油的国家进口，每单位进口的石油都会变成燃料。",
  "如果已研究合成炼油厂（工业页），在「建造」界面建造它们，可以凭空产出石油。",
  "减少浪费：让闲置的飞机停止任务，没事做的舰船留在港口。",
]

[rules.economy_partial_mobilisation]
title = "动员你的经济"
advice = "将经济法案改为部分动员（如果你能选择的话）。"
why = "民用经济会占用大量工厂生产消费品。部分动员能释放许多工厂，并加快建造和生产速度，是前期政治点数最好的用途之一。"
steps = [
  "点击顶栏的「政治」按钮。",
  "在法案区域点击经济法案（当前显示民用经济或早期动员）。",
  "选择「部分动员」。先把鼠标悬停在上面，查看政治点数花费和条件。",
  "如果是灰色的，提示框会说明缺少什么，通常是战争支持度或世界紧张度。稍后再试。",
]

[rules.economy_war_economy]
title = "转为战时经济"
advice = "你正处于战争中：将经济法案改为战时经济。"
why = "战时经济进一步减少消费品，提高军事产出。虽然要花费政治点数，但开战后几乎总是值得的。"
steps = [
  "点击顶栏的「政治」按钮。",
  "点击经济法案（部分动员）。",
  "选择「战时经济」并确认。",
  "释放出来的工厂会出现在「建造」和「生产」界面，给它们安排工作。",
]

# ---------------------------------------------------------------- 军事

[rules.front_collapsing]
title = "防线正在崩溃"
advice = "缩短战线：退守河流或要塞，并补充预备队。"
why = "你的投降进度正在上升。河流、要塞和狭窄的战线能大幅提升防御。一条守得住的短战线胜过一条会被突破的长战线。"
steps = [
  "在地图上找出防线正在崩溃的地方：你方正在输掉的战斗和敌军箭头。",
  "在前线后方寻找更好的防线：河流、山地、沼泽、要塞或狭窄的地带。",
  "选中你的集团军，沿这条线画一条新的「前线」，让各师撤到那里。",
  "把多余的师作为预备队放在薄弱处后方，并在「招募与部署」训练更多部队。",
]

[rules.small_army]
title = "训练更多师"
advice = "局势日益紧张，而你的军队规模很小。排队训练更多师。"
why = "训练一个师需要几个月。在开战前训练好，需要时才能派上用场。步兵师很便宜，足以守住一条战线。"
steps = [
  "点击顶栏的「招募与部署」按钮。",
  "选择一个编制（标准步兵师即可），选好数量，点击训练。",
  "训练队列会显示缺少的装备或人力。如果是红色，先解决这些问题。",
  "训练完成后部署它们，并编入集团军，这样才能下达命令。",
]

[rules.use_army_experience]
title = "改进师编制"
advice = "在师编制设计器中使用陆军经验。"
why = "陆军经验可以用来修改师的编制。支援连（工兵、侦察、炮兵）只需很少的代价，就能让师变得强得多。"
steps = [
  "点击「招募与部署」按钮，打开师编制设计器（编制旁边的编辑图标）。",
  "在左侧一列添加支援连，工兵和炮兵是不错的首选。",
  "在主网格中，可靠的防御师以步兵为主，再加一到两个炮兵营。",
  "保存编制。现有的师会随着新装备到位而逐步升级。",
]

[rules.use_battle_plans]
title = "使用作战计划"
advice = "把各师编入集团军，并给它们画前线和进攻箭头。"
why = "作战计划让将领一次指挥几十个师。在计划中等待的部队会获得计划加成，所以准备充分的进攻比手动指挥强得多。"
steps = [
  "在地图上选中一些师，然后点击屏幕底部的「组建集团军」，会自动分配一名将领。",
  "选中该集团军，使用「前线」工具沿着与敌人的边界画线。",
  "要进攻时，使用「进攻线」工具从前线向敌方领土画一条箭头。",
  "等计划进度条填满，然后点击「执行」。",
  "留几个师作为预备队，用来填补缺口。",
]

[rules.check_supply]
title = "保障军队补给"
advice = "查看补给地图模式。缺乏补给的师会迅速削弱。"
why = "各师通过补给基地和铁路获得补给。缺乏补给会降低组织度、削弱进攻能力，这是进攻停滞最常见的原因。"
steps = [
  "把地图切换到「补给」地图模式（右下角的地图模式按钮）。",
  "红色和橙色区域补给不足，带补给警告标志的部队正在受影响。",
  "在「建造」界面，从首都向前线修建铁路，并在靠近前线处建造补给基地。",
  "不要推进到远超补给网络的地方，等铁路跟上。",
]

[rules.air_superiority]
title = "争夺制空权"
advice = "生产战斗机，并让它们在前线上空执行制空任务。"
why = "如果敌人掌握制空权，你的部队移动变慢、受到的伤害增加。执行制空任务的战斗机是对策。"
steps = [
  "点击「生产」按钮，添加一条战斗机生产线。",
  "打开空军地图模式，找到靠近前线的空军基地。",
  "把战斗机联队移到该基地，并给它们分配前线区域的「制空」任务。",
  "留意该区域的制空权指示。占优后，再加入近距离空中支援（CAS）协助地面部队。",
]

[rules.protect_convoys]
title = "运输船队遭到攻击"
advice = "为运输船队护航，或调整贸易路线。"
why = "运输船队运送你的进口物资和海外部队的补给。被敌方潜艇和舰船击沉后，两者都会中断。护航和更多运输船能让物资继续流动。"
steps = [
  "点击「生产」按钮，添加运输船生产线以弥补损失。",
  "选择一支由驱逐舰组成的舰队，在危险海域给它分配「护航」任务。",
  "在「贸易」界面，优先选择航线避开敌方海域的供应国。",
  "之后研究能提升护航和反潜能力的海军科技。",
]

[rules.conscription_peace]
title = "提高征兵"
advice = "人力不足。将征兵法案改为有限征兵。"
why = "人力是可以征召入伍的人口。志愿兵役制提供的人力很少，有限征兵能大幅增加人力。"
steps = [
  "点击顶栏的「政治」按钮。",
  "点击征兵法案。",
  "选择「有限征兵」，先悬停查看花费。",
  "人力会在接下来几周逐步增长。",
]

[rules.conscription_war]
title = "扩大征兵"
advice = "你正处于战争中且人力不足。将征兵法案改为扩大征兵。"
why = "战时军队损耗很快。扩大征兵能征召更多人口，只会略微降低工厂产出。"
steps = [
  "点击顶栏的「政治」按钮。",
  "点击征兵法案（有限征兵）。",
  "选择「扩大征兵」并确认。",
  "如果是灰色的，提示框会显示所需的战争支持度。",
]

# ---------------------------------------------------------------- 政治与外交

[rules.pick_focus]
title = "选择国策"
advice = "始终保持一项国策在进行。前期优先选择提供工厂或政治点数的国策。"
why = "国策是你国家的长期规划，提供工厂、科研加成、政治点数和独特事件。没有国策的每一天都是浪费。"
steps = [
  "点击左上角国旗旁边的「国策」按钮。",
  "把鼠标悬停在国策上，查看效果和所需天数。",
  "前期优先选择提供政治点数、工厂或科研加成的国策。",
  "一项国策完成后，立即选择下一项。",
]

[rules.spend_political_power]
title = "花掉你的政治点数"
advice = "你积攒了大量政治点数。去雇佣顾问或更改法案吧。"
why = "闲置的政治点数就是浪费。好的用法：政治顾问或工业设计公司、经济和贸易法案，以及你国家可用的决议。"
steps = [
  "点击顶栏的「政治」按钮。",
  "填满空的顾问槽。前期增加政治点数或工厂产出的工业公司和政治顾问很强。",
  "或者更改法案：经济和贸易法案通常收益最大。",
  "也看看「决议」，很多决议能用政治点数换取工厂或资源。",
]

[rules.low_stability]
title = "稳定度过低"
advice = "通过国家精神、国策或顾问提高稳定度。"
why = "稳定度过低会降低工厂产出，还可能引发动荡。寻找能增加稳定度的国策和政治顾问，避免选择会降低稳定度的法案。"
steps = [
  "把鼠标悬停在顶栏的稳定度数值上，查看是什么在降低它。",
  "点击「政治」按钮，寻找增加稳定度的顾问。",
  "在国策树和「决议」中寻找提高稳定度的选项。",
  "在稳定度恢复之前，避免采用会降低稳定度的新法案。",
]

[rules.low_war_support]
title = "战争支持度过低"
advice = "提高战争支持度，它能解锁更强的经济和征兵法案。"
why = "战争支持度决定你能选择哪些法案，以及国民对损失的承受力。战争支持度低会阻碍动员法案，也让你的国家更容易被击败。"
steps = [
  "把鼠标悬停在顶栏的战争支持度数值上，查看影响因素。",
  "点击「政治」按钮，寻找增加战争支持度的顾问（例如宣传部长）。",
  "寻找能提高战争支持度的国策和决议。",
  "世界紧张度上升和处于战争状态也会逐渐提高它。",
]

[rules.check_decisions]
title = "查看你的决议"
advice = "决议能提供工厂、资源和政治点数，要定期查看。"
why = "很多国家都有大幅加成的决议：新工厂、资源开采权或稳定度。有些只在限定时间内可用。"
steps = [
  "点击顶栏的「政治」按钮，然后打开「决议」。",
  "展开每个分类，悬停查看决议的花费和收益。",
  "选择见效快的决议：工厂、资源，或缓解国家难题的决议。",
  "每隔几个月回来看看，随着国策推进会解锁新的决议。",
]

[rules.seek_faction]
title = "寻找盟友"
advice = "世界局势越来越危险。考虑加入一个阵营。"
why = "孤立的小国很容易成为目标。世界紧张度较高时，意识形态相同的阵营可能会接纳你，之后其成员会保卫你。"
steps = [
  "在地图上点击阵营领袖的国家（或使用「外交」界面）。",
  "选择「加入阵营」。悬停查看对方是否会接受以及原因。",
  "如果对方不接受，先改善关系，或请求某个大国提供保障独立。",
  "意识形态相同的国家更有可能同意。",
]

# ---------------------------------------------------------------- DLC

[rules.found_intelligence_agency]
title = "成立情报机构"
advice = "成立情报机构，解锁特工、密码破译和情报。"
why = "情报机构（抵抗运动 DLC）可以招募特工、建立情报网、窃取蓝图，并通过更好的情报看清敌军的师。前期花费低，整局游戏都能受益。"
steps = [
  "点击顶栏的「情报」按钮（眼睛图标）。",
  "点击「成立情报机构」，提示框会显示花费。",
  "在情报机构界面招募你的第一名特工。",
  "逐步选择机构升级，建造期间会占用民用工厂。",
]

[rules.use_intelligence_agency]
title = "让特工行动起来"
advice = "在敌国建立情报网并执行行动。"
why = "情报网能揭示敌军的师，还能执行窃取蓝图、渗透敌军等行动。更好的情报也能提高你针对敌人的作战计划效果。"
steps = [
  "点击「情报」按钮（眼睛图标），选择一名特工。",
  "选择「建立情报网」，目标是敌方省份，最好靠近前线或其首都。",
  "情报网强度足够后开始执行行动。悬停查看每项行动的要求。",
  "随着机构成长，招募更多特工。",
]

[rules.design_tanks]
title = "设计你的第一辆坦克"
advice = "使用坦克设计器，造一辆便宜可靠的坦克。"
why = "拥有「寸步不让」DLC 时，坦克由底盘和模块组成。一辆能大量生产、可靠性好的便宜设计，胜过一辆造不起的昂贵设计。"
steps = [
  "点击「生产」按钮，打开设计界面并选择一个坦克底盘。",
  "填满各个槽位：主炮、引擎、装甲，以及无线电等有用的附加模块。",
  "留意花费和可靠性数值，让坦克保持在能负担得起的范围内。",
  "保存设计，然后为它添加一条生产线。",
]

[rules.officer_corps]
title = "使用你的指挥点数"
advice = "用指挥点数选择陆军精神并填满最高统帅部。"
why = "指挥点数达到上限后就会浪费。陆军精神（寸步不让 DLC）和最高统帅部成员能为全军提供永久加成。"
steps = [
  "点击顶栏的「军官团」按钮（军官帽图标）。",
  "选择一项陆军精神，防御类精神对新手最有帮助。",
  "填满空的最高统帅部槽位（陆军总参谋长等），选择有用的加成。",
  "留一些指挥点数给将领特质和晋升。",
]

[rules.design_planes]
title = "设计更好的飞机"
advice = "在飞机设计器中使用空军经验。"
why = "拥有「血战到底」DLC 时，飞机由机体和模块组成。机枪更多、引擎更好的战斗机能赢得空战，而空战决定地面战斗。"
steps = [
  "点击「生产」按钮，打开设计界面并选择一个机体。",
  "战斗机：加装机枪和你最好的引擎，保证足够的航程飞到前线。",
  "保存设计，并把战斗机生产线切换到新设计。",
  "持续研究新机体，每种新机体都能解锁更好的设计。",
]

[rules.hire_mios]
title = "与军工组织合作"
advice = "把军工组织分配给生产线，获得免费加成。"
why = "在「铁拳抗暴」DLC 中，军工组织（MIO）能改进它们生产的装备。给每条重要的生产线分配一个军工组织，它会成长并解锁更多特质。"
steps = [
  "点击「生产」按钮，打开军工组织面板。",
  "为每种主要装备选择一个军工组织：步兵装备、火炮、坦克、飞机。",
  "把你的生产线分配给对应的军工组织。",
  "军工组织规模增长后解锁特质，选择降低成本或提高可靠性的特质。",
]

[rules.special_projects]
title = "启动特殊项目"
advice = "大国可以开展特殊项目：喷气引擎、火箭等。"
why = "特殊项目（诸神黄昏 DLC）是由科学家在设施中进行的长期计划，能解锁普通科研无法获得的独特武器和加成。"
steps = [
  "点击「科研」按钮，打开特殊项目。",
  "建造项目所需的设施，项目界面会显示哪些省份可以建造。",
  "指派一名科学家并启动项目。",
  "不时查看进度，项目需要时追加资源。",
]

[rules.gain_autonomy]
title = "从宗主国获得自治"
advice = "作为附属国，贡献部队和工厂来赢得更多自治度。"
why = "附属国（共同胜利 DLC，现已免费）通过帮助宗主国获得自治度：输送装备、参与其战争、发展工业。自治度足够后就能独立。"
steps = [
  "在宗主国的国家界面上，把鼠标悬停在自治度条上，查看提升方式。",
  "通过租借法案输送装备，并与宗主国并肩作战。",
  "建造工厂，经济越强，自治度增长越快。",
  "进度条满后，可以申请提升为更自由的附属等级，最终获得独立。",
]
